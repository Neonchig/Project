<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Test site</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="status-bar">
    <button class="icon-btn" id="menuToggle" aria-label="Открыть меню" aria-expanded="false">
      <!-- SVG стрелка назад -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="status-title">Статус-бар</span>
  </div>

  <div class="content"></div>

  <div class="menu-overlay" id="menuOverlay"></div>
  <aside class="side-menu" id="sideMenu" aria-hidden="true">
    <div class="side-menu-header">
      <button class="icon-btn" id="menuClose" aria-label="Закрыть меню">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="side-menu-body"">
        <div class="groups">
            <button class="side-menu-buttons" style="max-height: 15%;">SomeGroup</button>
        </div>
        <div style="height:20vh; margin-top: auto">
            <button class="side-menu-buttons">Send new message</button>
            <button class="side-menu-buttons">Settings</button>
        </div>
    </div>
  </aside>
  <script src="script.js"></script>
</body>
</html>
